# Domyślne ustawienia Campaign OS. Wartości progów można nadpisać w panelu bocznym aplikacji.

currency: PLN

# Domyślna długość zakresu analizy (ostatnie N dni dostępnych danych).
default_range_days: 30

thresholds:
  # Docelowy CPA. 0 = użyj średniego CPA konta w wybranym okresie.
  target_cpa: 0

  # Wasted spend: hasło bez konwersji, które wydało co najmniej tyle...
  wasted_min_cost: 30.0
  # ...i ma co najmniej tyle kliknięć.
  wasted_min_clicks: 5

  # High performer: hasło z co najmniej tyloma konwersjami...
  high_performer_min_conversions: 2
  # ...i CPA nie wyższym niż (docelowy CPA × ten mnożnik).
  high_performer_max_cpa_ratio: 0.8

  # Minimalna próba – poniżej tych wartości Campaign OS NIE rekomenduje zmian
  # (reguła odnotowuje tylko "za mała próba").
  min_clicks: 30
  min_impressions: 300
  min_conversions: 3
  # Próg istotności różnicy CVR segmentu vs reszta (|z| ≥ 1,96 ≈ 95% ufności).
  z_threshold: 1.96
